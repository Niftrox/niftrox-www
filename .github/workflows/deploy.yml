name: Deploy to GitHub Pages

# Pull requests run the same build as main, so a change that breaks `astro build` (a new Node
# floor, a broken dependency) fails on the PR instead of on the production deploy. Only a push to
# main or a manual run deploys.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Build with Astro
        uses: withastro/action@v6
        with:
          # Astro's Node floor moves with Node security releases (7.4.2 requires >=22.23.4) and
          # setup-node serves whatever 22.x the runner has cached, so track the active LTS line.
          node-version: 24

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    # Allow one concurrent deployment; don't cancel an in-progress one. Scoped to this job so PR
    # builds never queue behind, or displace, a pending deploy.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
